name: Weekly Vulnerability & Security Scan

on:
  # Automated scan at least once every 7 days (compliant with Amazon DPP 2.7 requirement: cadence of 30 days or less)
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-security:
    name: Backend Security & Vulnerability Scan (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Scan Python Dependencies for Known Vulnerabilities (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln || true

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r backend -ll -ii -x backend/env,backend/db.sqlite3 || true

  frontend-security:
    name: Frontend Security & Vulnerability Scan (Node/npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Scan Frontend Dependencies for Known Vulnerabilities (npm audit)
        run: |
          npm audit --audit-level=high || true
